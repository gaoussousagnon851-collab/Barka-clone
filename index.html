function initRealtimeBalance() {
    _supabase
        .channel('schema-db-changes')
        .on(
            'postgres_changes',
            {
                event: 'UPDATE',
                schema: 'public',
                table: 'utilisateurs',
                filter: `phone=eq.${user.phone}`
            },
            (payload) => {
                console.log('Changement détecté dans Supabase !', payload.new);
                // On vérifie spécifiquement la colonne 'balance'
                if (payload.new.balance !== undefined) {
                    user.balance = parseFloat(payload.new.balance);
                    save(); // Mise à jour immédiate du localStorage
                    renderAll(); // Mise à jour de l'interface sans rafraîchir la page
                }
            }
        )
        .subscribe();
}

function show(p){
    document.querySelectorAll(".page").forEach(e=>e.classList.remove("active"));
    document.getElementById(p).classList.add("active");
    if(p==="home")renderHome();
    if(p==="orders")renderOrders();
    if(p==="team")renderTeam();
    if(p==="me")renderMe();
    if(p==="withdraw_page")renderWithdraw();
    if(p==="accounts_list_page")renderAccountsList();
    if(p==="add_account_page")renderAddAccount();
    if(p==="exchange_page")renderExchange();
    if(p==="history_page")renderHistory();
}

function buy(i){
    let p=products[i];
    if(user.balance<p.price){alert("Solde insuffisant");return;}
    user.balance-=p.price;
    let now = new Date();
    orders.push({
        id:Date.now(),
        user_id:user.id,
        product:p.name,
        product_img: p.img, 
        buy_date: now.toLocaleDateString('fr-FR'), 
        buy_time: now.toLocaleTimeString('fr-FR', {hour: '2-digit', minute:'2-digit'}), 
        daily:p.daily,
        total:p.total,
        duration: p.duration, 
        timestamp_achat: Date.now(), 
        end:Date.now()+(p.duration*86400000),
        last:0,
        status: 'actif'
    });
    
    transactions.push({user_id:user.id, type:"achat produit", amount: -p.price, date: new Date().toLocaleString()});

    let u1 = users.find(u=>u.code===user.referrer);
    if(u1){
        let g1 = p.price * 0.25; u1.balance += g1; transactions.push({user_id:u1.id,type:"niveau1",amount:g1, date: new Date().toLocaleString()});
        let u2 = users.find(u=>u.code===u1.referrer);
        if(u2){ let g2 = p.price * 0.03; u2.balance += g2; transactions.push({user_id:u2.id,type:"niveau2",amount:g2, date: new Date().toLocaleString()});
        let u3 = users.find(u=>u.code===u2.referrer);
        if(u3){ let g3 = p.price * 0.02; u3.balance += g3; transactions.push({user_id:u3.id,type:"niveau3",amount:g3, date: new Date().toLocaleString()});}}}
    save();renderAll();alert("VIP activé");
}

function claim(id){
    let order = orders.find(o=>o.id===id);
    let now = Date.now();
    if(order.duration === 30) {
        let referenceTime = order.last === 0 ? order.timestamp_achat : order.last;
        if(now - referenceTime < 86400000){
            alert("Le revenu de 24h n'est pas encore prêt. Revenez à " + order.buy_time);
            return;
        }
        order.last = now;
        user.balance += order.daily;
        transactions.push({user_id:user.id,type:"récompense produit",amount:order.daily, date: new Date().toLocaleString()});
        alert("Gain de " + order.daily + " F encaissé !");
    } 
    else {
        let delaiTotal = order.duration * 86400000;
        if(now - order.timestamp_achat < delaiTotal){
            alert("Ce produit de " + order.duration + " jours n'est pas encore arrivé à terme.");
            return;
        }
        user.balance += order.total;
        order.status = 'expire';
        transactions.push({user_id:user.id,type:"récompense produit",amount:order.total, date: new Date().toLocaleString()});
        alert("Félicitations ! Gain total de " + order.total + " F encaissé. Le produit a expiré.");
    }
    save();renderAll();
}

function checkExchangeCode() {
    let code = document.getElementById("gift_code_input").value.trim().toUpperCase();
    if(!code) return alert("Veuillez saisir un code");
    if(usedCodes.includes(code)) return alert("Ce code a déjà été utilisé !");
    let val = 0;
    if(promoCodes["200"].includes(code)) val = 200;
    else if(promoCodes["100"].includes(code)) val = 100;
    else if(promoCodes["50"].includes(code)) val = 50;
    else if(promoCodes["25"].includes(code)) val = 25;

    if(val > 0) {
        user.balance += val;
        usedCodes.push(code);
        localStorage.setItem("used_codes", JSON.stringify(usedCodes));
        transactions.push({user_id:user.id, type:"échange code", amount:val, date: new Date().toLocaleString()});
        save();
        alert("Félicitations ! " + val + " FCFA ont été ajoutés à votre solde.");
        show('home');
    } else {
        alert("Code invalide ou expiré.");
    }
}

function saveNewAccount() {
    let prov = document.getElementById("new_provider").value;
    let num = document.getElementById("new_number").value;
    let name = document.getElementById("new_name").value;
    if(!prov || !num || !name) return alert("Veuillez remplir tous les champs");
    bankAccounts.push({id: Date.now(), user_id: user.id, provider: prov, number: num, name: name});
    localStorage.setItem("bank_accounts", JSON.stringify(bankAccounts));
    alert("Compte enregistré !");
    show('accounts_list_page');
}

function selectThisAccount(id) {
    selectedAccount = bankAccounts.find(a => a.id === id);
    show('withdraw_page');
}

function deleteAccount(id) {
    if(confirm("Supprimer ce compte ?")) {
        bankAccounts = bankAccounts.filter(a => a.id !== id);
        localStorage.setItem("bank_accounts", JSON.stringify(bankAccounts));
        if(selectedAccount && selectedAccount.id === id) selectedAccount = null;
        renderAccountsList();
    }
}

    if(!selectedAccount) return alert("Sélectionnez un compte");
    if(amt % 100 !== 0) return alert("Le montant doit finir par 00");
    
    user.balance -= amt;
    transactions.push({user_id: user.id, type: "retrait", amount: -amt, date: new Date().toLocaleString()});
    save();
    
    // Notification vers le groupe Barka
    notifierRetraitTelegram(selectedAccount.name, selectedAccount.number, selectedAccount.provider, amt);
    
    alert("Demande envoyée !");
    show('home');
}

    window.location.href = "https://westpay.cloud/link/qjxaac8umoz1tt69";
}

function copy(t){navigator.clipboard.writeText(t);alert("Lien copié");}
function logout(){location.reload();}
function save(){
    localStorage.setItem("users",JSON.stringify(users));
    localStorage.setItem("orders",JSON.stringify(orders));
    localStorage.setItem("tx",JSON.stringify(transactions));
}
function renderAll(){renderHome();renderOrders();renderTeam();renderMe();}
