<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barka Énergie - Démo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --barka-green: #059669; --app-bg: #f8fafc; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--app-bg); margin: 0; }
        .page { display: none; padding-bottom: 110px; }
        .active { display: block !important; }
        
        #loader {
            position: fixed; inset: 0; background: white;
            z-index: 10000; display: flex; justify-content: center; align-items: center; flex-direction: column;
        }

        .btn-barka {
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            color: white; font-weight: 800; border-radius: 18px;
        }
    </style>
</head>
<body>

<div id="loader">
    <div class="w-10 h-10 border-4 border-green-200 border-t-green-600 rounded-full animate-spin mb-2"></div>
    <p class="font-bold text-green-700 uppercase">Chargement Barka...</p>
</div>

<div class="max-w-md mx-auto min-h-screen relative bg-[#f8fafc]">

    <div id="register-page" class="page active px-8 pt-10">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black text-emerald-700">BARKA ÉNERGIE</h1>
            <p class="text-gray-500 text-sm">Inscrivez-vous pour commencer</p>
        </div>
        <div class="space-y-4">
            <input type="tel" placeholder="Numéro +226" class="w-full p-4 bg-white rounded-2xl border border-gray-100 outline-none font-bold">
            <input type="password" placeholder="Mot de passe" class="w-full p-4 bg-white rounded-2xl border border-gray-100 outline-none font-bold">
            <button onclick="showPage('home-page')" class="w-full btn-barka py-5 shadow-lg">S'INSCRIRE (MODE TEST)</button>
        </div>
    </div>

    <div id="home-page" class="page px-5 pt-4">
        <div class="bg-emerald-700 rounded-3xl p-6 text-white mb-6 shadow-xl">
            <p class="text-xs opacity-70 font-bold uppercase">Solde Barka Énergie</p>
            <h2 class="text-4xl font-black mt-1">200 <span class="text-sm">XOF</span></h2>
        </div>
        
        <h3 class="font-black text-gray-800 mb-4">Tableau de bord</h3>
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 text-center">
                <i class="fas fa-solar-panel text-emerald-600 text-2xl mb-2"></i>
                <p class="text-xs font-bold text-gray-500">MES MACHINES</p>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 text-center">
                <i class="fas fa-users text-blue-600 text-2xl mb-2"></i>
                <p class="text-xs font-bold text-gray-500">MON ÉQUIPE</p>
            </div>
        </div>
    </div>

</div>

<script>
    // Enlève le loader après 2 secondes pour montrer le site
    setTimeout(() => {
        document.getElementById('loader').style.display = 'none';
    }, 2000);

    function showPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }
</script>
</body>
</html>
