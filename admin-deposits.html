<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Gestion des Dépôts</title>
    <!-- Chargement de la bibliothèque Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 10px; font-size: 12px; color: #333; }
        h3 { color: #000; margin-bottom: 5px; }
        #searchInput { 
            width: 100%; 
            padding: 10px; 
            margin: 10px 0; 
            border: 1px solid #ddd; 
            border-radius: 4px; 
            box-sizing: border-box; 
        }
        table { width: 100%; border-collapse: collapse; background: #fff; }
        th, td { border: 1px solid #ccc; padding: 6px; text-align: center; }
        th { background-color: #f2f2f2; font-weight: bold; }
        
        /* Couleurs des statuts comme sur la photo */
        .statut-attente { color: #d4a017; font-weight: bold; } /* Orange */
        .statut-valide { color: #28a745; font-weight: bold; }  /* Vert */
        .statut-rejete { color: #dc3545; font-weight: bold; }  /* Rouge */
        
        .btn-action { 
            background: none; 
            border: none; 
            cursor: pointer; 
            text-decoration: underline; 
            font-size: 12px; 
            margin: 0 3px; 
        }
        .btn-valider { color: #28a745; }
        .btn-rejeter { color: #dc3545; }
        tr:hover { background-color: #f9f9f9; }
    </style>
</head>
<body>

    <h3>Liste des dépôts</h3>
    <input type="text" id="searchInput" onkeyup="filtrer()" placeholder="Rechercher numéro, référence ou montant...">

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Numéro</th>
                <th>Montant</th>
                <th>Référence</th>
                <th>Date</th>
                <th>Statut</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="table-body">
            <!-- Les données arrivent ici -->
        </tbody>
    </table>

    <script>
        // Configuration avec tes identifiants
        const SUPABASE_URL = 'https://lnqmtqbxivjozhsysuse.supabase.co';
        const SUPABASE_KEY = 'EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxucW10cWJ4aXZqb3poc3lzdXNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwMTIzNjYsImV4cCI6MjA5MzU4ODM2Nn0.98cTAWRd8101MYXd7JJrnGP_4pIT5gLMThULwSOJWl0';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 1. Charger la liste complète
        async function chargerDonnees() {
            const { data: depots, error } = await _supabase
                .from('depots')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) return console.error(error);
            
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            depots.forEach(d => ajouterLigne(d));
        }

        // 2. Créer une ligne dans le tableau
        function ajouterLigne(d) {
            const tbody = document.getElementById('table-body');
            const row = document.createElement('tr');
            
            let classeStatut = "statut-attente";
            if(d.statut === 'Validé') classeStatut = "statut-valide";
            if(d.statut === 'Rejeté') classeStatut = "statut-rejete";

            row.innerHTML = `
                <td>${d.id.toString().substring(0, 4)}</td>
                <td>${d.phone_utilisateur}</td>
                <td>${parseFloat(d.montant).toFixed(1)}</td>
                <td>${d.id_transaction || 'None'}</td>
                <td>${new Date(d.created_at).toLocaleString('fr-FR')}</td>
                <td class="${classeStatut}">${d.statut}</td>
                <td>
                    <button class="btn-action btn-valider" onclick="traiterDepot('${d.id}', 'Validé', '${d.phone_utilisateur}', ${d.montant})">Valider</button>
                    <button class="btn-action btn-rejeter" onclick="traiterDepot('${d.id}', 'Rejeté')">Rejeter</button>
                </td>
            `;
            tbody.appendChild(row);
        }

        // 3. Action Valider ou Rejeter
        async function traiterDepot(id, nouveauStatut, phone, montant) {
            if (!confirm(`Confirmer l'action : ${nouveauStatut} ?`)) return;

            // Si validé, on augmente le solde de l'utilisateur
            if (nouveauStatut === 'Validé') {
                const { data: user } = await _supabase.from('utilisateurs').select('solde').eq('phone', phone).single();
                if (user) {
                    await _supabase.from('utilisateurs').update({ solde: (user.solde + montant) }).eq('phone', phone);
                }
            }

            // Mise à jour du statut du dépôt
            const { error } = await _supabase.from('depots').update({ statut: nouveauStatut }).eq('id', id);
            
            if (error) alert("Erreur: " + error.message);
            else chargerDonnees(); // Rafraîchir
        }

        // 4. TEMPS RÉEL (Realtime)
        _supabase.channel('custom-all-channel')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'depots' }, (payload) => {
            console.log('Changement détecté !');
            chargerDonnees(); // Recharge tout le tableau dès qu'un client bouge
        })
        .subscribe();

        // 5. Recherche rapide
        function filtrer() {
            let filter = document.getElementById("searchInput").value.toUpperCase();
            let tr = document.getElementById("table-body").getElementsByTagName("tr");
            for (let i = 0; i < tr.length; i++) {
                tr[i].style.display = tr[i].innerText.toUpperCase().indexOf(filter) > -1 ? "" : "none";
            }
        }

        // Lancement
        chargerDonnees();
    </script>
</body>
</html>
