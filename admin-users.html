<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Gestion des utilisateurs</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; font-size: 11px; margin: 5px; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f2f2f2; padding: 5px; border: 1px solid #ccc; }
        td { padding: 5px; border: 1px solid #ccc; text-align: center; }
        .btn-add { background: #28a745; color: white; border: none; padding: 3px 7px; cursor: pointer; }
        .btn-rem { background: #fd7e14; color: white; border: none; padding: 3px 7px; cursor: pointer; }
        .btn-ban { background: #dc3545; color: white; border: none; padding: 5px; cursor: pointer; border-radius: 3px; }
        .input-mini { width: 50px; padding: 2px; }
        .status-actif { color: green; font-weight: bold; }
        .status-suspendu { color: red; font-weight: bold; }
    </style>
</head>
<body>

    <h3>Gestion des utilisateurs</h3>
    <input type="text" id="search" onkeyup="filtrer()" placeholder="Rechercher numéro..." style="width:200px; margin-bottom:10px; padding:5px;">

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Numéro</th>
                <th>Solde</th>
                <th>Date</th>
                <th>Statut</th>
                <th>Crédit / Débit</th>
                <th>VIP</th>
                <th>Bannir</th>
            </tr>
        </thead>
        <tbody id="user-table">
            <!-- Rempli par JS -->
        </tbody>
    </table>

    <script>
        const SUPABASE_URL = 'https://lnqmtqbxivjozhsysuse.supabase.co';
        const SUPABASE_KEY = 'EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxucW10cWJ4aXZqb3poc3lzdXNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwMTIzNjYsImV4cCI6MjA5MzU4ODM2Nn0.98cTAWRd8101MYXd7JJrnGP_4pIT5gLMThULwSOJWl0';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function chargerUsers() {
            const { data: users } = await _supabase.from('utilisateurs').select('*').order('created_at', { ascending: false });
            const tbody = document.getElementById('user-table');
            tbody.innerHTML = '';

            users.forEach((u, index) => {
                const row = document.createElement('tr');
                const isSuspendu = u.statut === 'Suspendu';
                
                row.innerHTML = `
                    <td>${users.length - index}</td>
                    <td><b>${u.phone}</b></td>
                    <td>${u.solde} FCFA</td>
                    <td>${new Date(u.created_at).toLocaleDateString()}</td>
                    <td class="${isSuspendu ? 'status-suspendu' : 'status-actif'}">${u.statut || 'Actif'}</td>
                    <td>
                        <input type="number" id="amt-${u.phone}" class="input-mini" placeholder="montant">
                        <button class="btn-add" onclick="modifierArgent('${u.phone}', 'add')">+</button>
                        <button class="btn-rem" onclick="modifierArgent('${u.phone}', 'sub')">-</button>
                    </td>
                    <td>
                        <select onchange="changerVIP('${u.phone}', this.value)">
                            <option value="VIP0" ${u.vip_level=='VIP0'?'selected':''}>VIP0</option>
                            <option value="VIP1" ${u.vip_level=='VIP1'?'selected':''}>VIP1</option>
                            <option value="VIP2" ${u.vip_level=='VIP2'?'selected':''}>VIP2</option>
                            <option value="VIP3" ${u.vip_level=='VIP3'?'selected':''}>VIP3</option>
                        </select>
                    </td>
                    <td>
                        <button class="btn-ban" onclick="toggleBan('${u.phone}', '${u.statut}')">
                            ${isSuspendu ? 'Activer' : 'Suspendre'}
                        </button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        // --- FONCTIONS ACTIONS ---

        async function modifierArgent(phone, action) {
            const input = document.getElementById(`amt-${phone}`);
            const montant = parseFloat(input.value);
            if (!montant) return;

            const { data } = await _supabase.from('utilisateurs').select('solde').eq('phone', phone).single();
            const nouveauSolde = action === 'add' ? (data.solde + montant) : (data.solde - montant);

            await _supabase.from('utilisateurs').update({ solde: nouveauSolde }).eq('phone', phone);
            input.value = '';
            chargerUsers();
        }

        async function changerVIP(phone, level) {
            await _supabase.from('utilisateurs').update({ vip_level: level }).eq('phone', phone);
            alert("VIP mis à jour");
        }

        async function toggleBan(phone, actuel) {
            const nouveau = (actuel === 'Suspendu') ? 'Actif' : 'Suspendu';
            await _supabase.from('utilisateurs').update({ statut: nouveau }).eq('phone', phone);
            chargerUsers();
        }

        // --- TEMPS RÉEL (Nouveaux inscrits) ---
        _supabase.channel('admin-users').on('postgres_changes', { event: '*', schema: 'public', table: 'utilisateurs' }, () => {
            chargerUsers();
        }).subscribe();

        function filtrer() {
            let val = document.getElementById("search").value.toUpperCase();
            let trs = document.querySelectorAll("#user-table tr");
            trs.forEach(tr => tr.style.display = tr.innerText.toUpperCase().includes(val) ? "" : "none");
        }

        chargerUsers();
    </script>
</body>
</html>
