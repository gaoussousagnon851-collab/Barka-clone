<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Gestion des utilisateurs</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; font-size: 11px; margin: 5px; background: #fff; }
        h3 { margin: 10px 0; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th { background: #f2f2f2; padding: 8px; border: 1px solid #ccc; font-weight: bold; }
        td { padding: 8px; border: 1px solid #ccc; text-align: center; vertical-align: middle; }
        
        .input-mini { width: 60px; padding: 4px; border: 1px solid #ddd; border-radius: 3px; }
        .btn-add { background: #28a745; color: white; border: none; padding: 4px 8px; cursor: pointer; border-radius: 3px; font-weight: bold; }
        .btn-rem { background: #fd7e14; color: white; border: none; padding: 4px 8px; cursor: pointer; border-radius: 3px; font-weight: bold; margin-top: 2px; }
        .btn-ban { background: #dc3545; color: white; border: none; padding: 6px; cursor: pointer; border-radius: 4px; width: 100%; }
        
        .status-actif { color: green; font-weight: bold; }
        .status-suspendu { color: red; font-weight: bold; }
        
        #loading-msg { padding: 20px; text-align: center; font-weight: bold; color: #666; }
    </style>
</head>
<body>

    <h3>Gestion des utilisateurs</h3>
    <input type="text" id="search" onkeyup="filtrer()" placeholder="Rechercher numéro..." style="width:100%; max-width:300px; margin-bottom:15px; padding:10px; border: 1px solid #ccc;">

    <div id="loading-msg">Chargement des données Supabase...</div>

    <div style="overflow-x: auto;">
        <table id="main-table" style="display:none;">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Numéro</th>
                    <th>Solde</th>
                    <th>Date</th>
                    <th>Statut</th>
                    <th>Crédit / Débit</th>
                    <th>VIP</th>
                    <th>Bannir</th>
                </tr>
            </thead>
            <tbody id="user-table"></tbody>
        </table>
    </div>

    <script>
        const SUPABASE_URL = 'https://lnqmtqbxivjozhsysuse.supabase.co';
        const SUPABASE_KEY = 'EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxucW10cWJ4aXZqb3poc3lzdXNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwMTIzNjYsImV4cCI6MjA5MzU4ODM2Nn0.98cTAWRd8101MYXd7JJrnGP_4pIT5gLMThULwSOJWl0';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function chargerUsers() {
            console.log("Tentative de chargement...");
            const { data: users, error } = await _supabase
                .from('utilisateurs')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                document.getElementById('loading-msg').innerHTML = "❌ Erreur : " + error.message;
                console.error(error);
                return;
            }

            if (!users || users.length === 0) {
                document.getElementById('loading-msg').innerHTML = "ℹ️ Aucune donnée trouvée dans la table 'utilisateurs'.";
                return;
            }

            document.getElementById('loading-msg').style.display = 'none';
            document.getElementById('main-table').style.display = 'table';

            const tbody = document.getElementById('user-table');
            tbody.innerHTML = '';

            users.forEach((u, index) => {
                const row = document.createElement('tr');
                const isSuspendu = (u.statut === 'Suspendu' || u.statut === 'refusé');
                const userPhone = u.phone || "N/A";
                const userSolde = u.solde !== undefined ? u.solde : 0;
                
                row.innerHTML = `
                    <td>${users.length - index}</td>
                    <td><b>${userPhone}</b></td>
                    <td>${userSolde} FCFA</td>
                    <td>${u.created_at ? new Date(u.created_at).toLocaleDateString() : '-'}</td>
                    <td class="${isSuspendu ? 'status-suspendu' : 'status-actif'}">${u.statut || 'Actif'}</td>
                    <td>
                        <input type="number" id="amt-${u.id}" class="input-mini" placeholder="0">
                        <button class="btn-add" onclick="modifierArgent('${u.id}', 'add', ${userSolde})">+</button>
                        <button class="btn-rem" onclick="modifierArgent('${u.id}', 'sub', ${userSolde})">-</button>
                    </td>
                    <td>
                        <select onchange="changerVIP('${u.id}', this.value)" style="font-size:10px;">
                            <option value="VIP0" ${u.vip_level=='VIP0'?'selected':''}>VIP0</option>
                            <option value="VIP1" ${u.vip_level=='VIP1'?'selected':''}>VIP1</option>
                            <option value="VIP2" ${u.vip_level=='VIP2'?'selected':''}>VIP2</option>
                            <option value="VIP3" ${u.vip_level=='VIP3'?'selected':''}>VIP3</option>
                        </select>
                    </td>
                    <td>
                        <button class="btn-ban" onclick="toggleBan('${u.id}', '${u.statut}')">
                            ${isSuspendu ? 'Activer' : 'Suspendre'}
                        </button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        async function modifierArgent(id, action, soldeActuel) {
            const input = document.getElementById(`amt-${id}`);
            const montant = parseFloat(input.value);
            if (!montant || isNaN(montant)) return;

            const nouveauSolde = action === 'add' ? (soldeActuel + montant) : (soldeActuel - montant);
            const { error } = await _supabase.from('utilisateurs').update({ solde: nouveauSolde }).eq('id', id);
            
            if (error) alert(error.message);
            else chargerUsers();
        }

        async function changerVIP(id, level) {
            const { error } = await _supabase.from('utilisateurs').update({ vip_level: level }).eq('id', id);
            if (error) alert(error.message);
            else alert("VIP mis à jour !");
        }

        async function toggleBan(id, statutActuel) {
            const nouveau = (statutActuel === 'Suspendu') ? 'Actif' : 'Suspendu';
            const { error } = await _supabase.from('utilisateurs').update({ statut: nouveau }).eq('id', id);
            if (error) alert(error.message);
            else chargerUsers();
        }

        function filtrer() {
            let val = document.getElementById("search").value.toUpperCase();
            let trs = document.querySelectorAll("#user-table tr");
            trs.forEach(tr => tr.style.display = tr.innerText.toUpperCase().includes(val) ? "" : "none");
        }

        // Initialisation
        chargerUsers();
        
        // Realtime
        _supabase.channel('users-admin').on('postgres_changes', { event: '*', schema: 'public', table: 'utilisateurs' }, () => {
            chargerUsers();
        }).subscribe();
    </script>
</body>
</html>
